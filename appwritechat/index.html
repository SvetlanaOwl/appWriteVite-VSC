<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login page</title>
    <!--Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  </head>
  <body class="min*h-screen flex inems-center justify-center
              bg-gradient-to-r from-[#74ebd5] to-[#ACB6E5]
              dark:bg-gradient-to-r dark:from-[#0f766e] dark:to-[#1e3a8a]">
    <!--Login card-->
    <div class="w-full max-w-sm bg-white dark:bg-gray-700 shadow-md rounded-lg p-8">

      <!--Header + Theme Toggle-->
      <div class="flex items-center justify-between mb-6">
        <h2 id="loginMessage" class="text-2xl font-semibold text-gray-800 dark:text-gray-200">
          Sign In
        </h2>
        <!--Theme Toggle Button-->
        <button id="themeToggle" class="p-2 rounded text-gray-700 dark:text-gray-300">
          <i id="icon"></i>
        </button>
      </div>
      <!--Login Form-->
      <form id="loginForm" class="space-y-4">
        <!--Email-->
        <div class="flex items-center border border-gray-300 bg-white text-gray-700
          rounded-md px-3 py-2 dark:border-gray-500 dark:bg-gray-800 dark:text-gray-300">
        <i class="fa-solid fa-user text-gray-400 dark:text-gray-500"></i>
        <input type="email" id="loginEmail" class="login-input ml-3 w-full bg-white
          text-gray-700 dark:bg-gray-800 dark:text-gray-300 focus:outline-none"
        placeholder="Email" required>
        </div>
        <!--Password-->
        <div class="flex items-center border border-gray-300 bg-white text-gray-700
            rounded-md px-3 py-2 dark:border-gray-500 dark:bg-gray-800 dark:text-gray-300">
          <i class="fa-solid fa-lock text-gray-400 dark:text-gray-500"></i>
          <input type="password" id="loginPassword" 
            class="login-input ml-3 w-full bg-white text-gray-700
              dark:bg-gray-800 dark:text-gray-300 focus:outline-none"
            placeholder="Password" required>
        </div>
        <!--Loggin Button-->
        <button type="button" id="loginBtn"
            class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 transition">
          Login
        </button>
      </form>
      <!--Registration Link-->
      <p class="text-center text-sm text-gray-600 dark:text-gray-300 mt-4">
        Not registered yet?
        <a href="./register.html" class="text-blue-500 hover:underline">Register here</a>
      </p>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const username = localStorage.getItem("username");
            const loginMessage = document.getElementById("loginMessage");

            if (username && loginMessage) {
                loginMessage.textContent = `Hello, ${username}!`;
            }
        });
    </script>

    <script type="module" src="/src/pages/main.js"></script>

</body>
</html>
