<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-[#74ebd5] to-[#ACB6E5] dark:bg-gradient-to-r dark:from-[#0f766e] dark:to-[#1e3a8a]">
    <div class="w-full max-w-sm bg-white dark:bg-gray-600 shadow-md rounded-lg p-8">
        <h2 id = "contactList" class="text-2xl font-semibold text-center dark:text-slate-400 mb-6">Contact Us</h2>
        <form id="contactForm" class="space-y-4">
            <!-- Firstname -->
            <div class="flex items-center border border-gray-300 rounded-md px-3 py-2 dark:border-gray-500 dark:bg-gray-700 dark:text-slate-400">
                <label class="block mb-1">Firstname</label>
                <input type="text" id="name" class="login-input ml-3 w-full bg-transparent focus:outline-none" required>
            </div>
            <!--Lastname -->
            <div class="flex items-center border border-gray-300 rounded-md px-3 py-2 dark:border-gray-500 dark:bg-gray-700 dark:text-slate-400">
                <label class="block mb-1">Lastname</label>
                <input type="text" id="last-name" class="login-input ml-3 w-full bg-transparent focus:outline-none" required>
            </div>
            <!-- Country -->
            <div class="flex items-center border border-gray-300 rounded-md px-3 py-2 dark:border-gray-500 dark:bg-gray-700 dark:text-slate-400">
                <label class="block mb-1">Country</label>
                <input type="text" id="country" class="login-input ml-3 w-full bg-transparent focus:outline-none" prequired>
            </div>
            <!--Color eye -->
            <div class="flex items-center border border-gray-300 rounded-md px-3 py-2 dark:border-gray-500 dark:bg-gray-700 dark:text-slate-400">
                <label class="block mb-1">Color eye</label>
                <input type="text" id="eye" class="login-input ml-3 w-full bg-transparent focus:outline-none" required>
            </div>
            <!-- Age -->
            <div class="flex items-center border border-gray-300 rounded-md px-3 py-2 dark:border-gray-500 dark:bg-gray-700 dark:text-slate-400">
                <label class="block mb-1">Age</label>
                <input type="number" id="age" class="login-input ml-3 w-full bg-transparent focus:outline-none" required>
            </div>
            <!-- Button -->
            <button type="button" id="submit-btn" class="w-full bg-green-500 dark:bg-green-700 text-white dark:text-slate-300 py-2 rounded-md hover:bg-green-600 dark:hover:bg-green-800">Жмяк</button>
        </form>
    </div>
    
    <script type="module" src="../src/pages/form.js"></script>

</body>
</html>
