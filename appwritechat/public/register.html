<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appwrite Register Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-[#74ebd5] to-[#ACB6E5] dark:bg-gradient-to-r dark:from-[#0f766e] dark:to-[#1e3a8a]">
    <div class="w-full max-w-sm bg-white dark:bg-gray-600 shadow-md rounded-lg p-8">
        <h2 id = "loginMessage" class="text-2xl font-semibold text-center dark:text-slate-400 mb-6">Register New Account</h2>
        <form id="registrationForm" class="space-y-4">
            <!-- Username -->
            <div class="flex items-center border border-gray-300 rounded-md px-3 py-2 dark:border-gray-500 dark:bg-gray-700 dark:text-slate-400">
                <i class="fa-solid fa-user text-gray-400"></i>
                <input type="email" id="regEmail" class="login-input ml-3 w-full bg-transparent focus:outline-none" placeholder="Email" required>
            </div>
            <!-- Password -->
            <div class="flex items-center border border-gray-300 rounded-md px-3 py-2 dark:border-gray-500 dark:bg-gray-700 dark:text-slate-400">
                <i class="fa-solid fa-lock text-gray-400"></i>
                <input type="password" id="regPassword" class="login-input ml-3 w-full bg-transparent focus:outline-none" placeholder="Password" required>
            </div>
            <!-- Register Button -->
            <button type="button" id="registerBtn" class="w-full bg-green-500 dark:bg-green-700 text-white dark:text-slate-300 py-2 rounded-md hover:bg-green-600 dark:hover:bg-green-800">Register</button>
        </form>
    </div>
    
    <script type="module" src="/src/register.js"></script>

</body>
</html>
